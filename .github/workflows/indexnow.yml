name: Notify IndexNow

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the release
        uses: actions/checkout@v4

      - name: Notify search engines from the live sitemap
        run: node scripts/submit-indexnow.mjs
